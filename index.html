
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{

  --border:#ffffff0f;--border2:#ffffff18;

html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:1100px;margin:0 auto;padding:1rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}
.logo{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--text)}
.logo em{color:var(--gold);font-style:normal}
.ver-badge{font-size:10px;background:var(--bg3);color:var(--text3);padding:2px 8px;border-radius:20px;border:1px solid var(--border2);margin-left:6px;vertical-align:middle}

/* CASE GRID */
.screen-select{display:flex;flex-direction:column;gap:1rem}

.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.case-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:1rem;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.case-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c,var(--blue));opacity:0;transition:opacity .18s}
.case-card:hover{background:var(--bg3);border-color:var(--border2);transform:translateY(-2px)}
.case-card:hover::before,.case-card.selected::before{opacity:1}
.case-card.selected{background:var(--bg3);border-color:var(--c,var(--blue))}
.cc-top{display:flex;align-items:center;gap:10px}
.cc-icon{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--bg);flex-shrink:0}
.cc-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:3px}
.cc-date{font-size:10px;color:var(--text3)}
.cc-price{font-size:11px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap}

.cc-rarities{display:flex;gap:3px}

.btn-start-case{width:100%;padding:.65rem;border:1px solid var(--border2);border-radius:8px;background:var(--bg4);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}

/* SIM */
.screen-sim{display:none;flex-direction:column;gap:10px}
.screen-sim.active{display:flex}

.back-btn{padding:6px 14px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}

.sim-case-info{display:flex;align-items:center;gap:10px;flex:1}

.qpill{padding:3px 10px;border:1px solid var(--border2);border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:var(--text3);transition:all .15s;font-family:'Inter',sans-serif}

/* ── 사운드 (Web Audio API) ── */
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playTick(){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type='triangle';o.frequency.value=800+Math.random()*400;
  g.gain.setValueAtTime(0.04,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.06);
  o.start();o.stop(AC.currentTime+0.06);
}
function playReel(){
  let t=0;
  const ticks=[0,50,100,150,200,250,300,350,400,450,500,580,660,760,870,990,1130,1290,1470,1680,1920,2200,2520,2900,3300];
  ticks.forEach(ms=>setTimeout(()=>playTick(),ms));
}
function playReveal(rarity){
  const freqs={mil:440,res:550,cl:660,sv:880,sp:1100};
  const f=freqs[rarity]||440;
  [0,100,200].forEach((d,i)=>{
    setTimeout(()=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);
      o.type='sine';o.frequency.value=f*(1+i*0.5);
      g.gain.setValueAtTime(0.1,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.3);
      o.start();o.stop(AC.currentTime+0.3);
    },d);
  });
}

let curCase=null,spinning=false,qty=1,autoRunning=false,autoTimer=null;
let casePriceKrw=0,keyPriceKrw=3690;
let stats={total:0,cost:0,value:0};
let reelRefs=[],sessionResults=[];
let openCount=0; // 이번 세션 총 오픈 순서

function krw(v){return '₩'+Math.round(v||0).toLocaleString('ko-KR')}
function profitStr(v){return (v>=0?'+ ':'\u2212 ')+krw(Math.abs(v))}

function pickRarity(){
  const t=[['mil',79.92],['res',15.98],['cl',3.20],['sv',0.64],['sp',0.26]];
  let acc=0,r=Math.random()*100;
  for(const[k,p]of t){acc+=p;if(r<acc)return k;}return 'mil';
}
function pickWearIdx(){
  let acc=0,r=Math.random();
  for(let i=0;i<WEAR_PROB.length;i++){acc+=WEAR_PROB[i];if(r<acc)return i;}return 2;
}
function pickItem(rarity){
  const pool=(curCase.items||[]).filter(x=>x.r===rarity);
  if(!pool.length){const fb=curCase.items.filter(x=>x.r==='mil');return fb[Math.floor(Math.random()*fb.length)];}
  return pool[Math.floor(Math.random()*pool.length)];
}
function pickST(item){return !item.noST&&Math.random()<0.10;}

/* FT 기준 가격에서 마모도 배율 적용 */
function getPrice(item,wIdx){
  return Math.round(item.pFT*WEAR_MULT[wIdx]);
}
function getPriceWithST(item,wIdx,isST){
  const base=getPrice(item,wIdx);
  return isST?Math.round(base*(item.stMul||1.15)):base;
}

/* ── 케이스 선택 ── */
function buildCaseGrid(){
  const grid=document.getElementById('caseGrid');
  grid.innerHTML=CASES.map(c=>{
    const dots=Object.entries(RC).map(([k,v])=>`<div class="cc-dot" style="background:${v.color}"></div>`).join('');
    return `<div class="case-card" id="cc_${c.id}" style="--c:${c.color}" onclick="selectCase('${c.id}')">
      <div class="cc-top">
        <div class="cc-icon">${c.emoji}</div>
        <div><div class="cc-name">${c.name}</div><div class="cc-date">${c.date} 출시</div></div>
      </div>
      <div class="cc-rarities">${dots}</div>
      <div class="cc-price">케이스: <span id="ccp_${c.id}">로딩...</span> · 열쇠: <span id="ckp_${c.id}">₩3,690</span></div>
      <button class="btn-start-case">시뮬레이터 시작 →</button>
    </div>`;
  }).join('');
  CASES.forEach(c=>loadCaseCardPrice(c));
}

const PROXY='https://api.allorigins.win/raw?url=';
async function fetchKrw(hash){
  try{
    const url=`https://steamcommunity.com/market/priceoverview/?currency=10&appid=730&market_hash_name=${encodeURIComponent(hash)}`;
    const r=await fetch(PROXY+encodeURIComponent(url),{signal:AbortSignal.timeout(5000)});
    const d=await r.json();
    if(d.success){const raw=(d.median_price||d.lowest_price||'').replace(/[^0-9]/g,'');return parseInt(raw,10)||0;}
  }catch(e){}return 0;
}
async function loadCaseCardPrice(c){
  const[cp,kp]=await Promise.all([fetchKrw(c.caseHash),fetchKrw('CS2 Case Key')]);
  c._caseKrw=cp>0?cp:c.fallbackCase;
  c._keyKrw=kp>0?kp:c.fallbackKey;
  const ce=document.getElementById('ccp_'+c.id);
  const ke=document.getElementById('ckp_'+c.id);
  if(ce)ce.textContent=krw(c._caseKrw)+(cp===0?' (참고)':'');
  if(ke)ke.textContent=krw(c._keyKrw)+(kp===0?' (참고)':'');
}

function selectCase(id){
  curCase=CASES.find(c=>c.id===id);
  casePriceKrw=curCase._caseKrw||curCase.fallbackCase;
  keyPriceKrw=curCase._keyKrw||curCase.fallbackKey;
  stats={total:0,cost:0,value:0};
  sessionResults=[];openCount=0;
  document.getElementById('screenSelect').style.display='none';
  const sim=document.getElementById('screenSim');
  sim.style.display='flex';sim.classList.add('active');
  document.getElementById('simIcon').textContent=curCase.emoji;
  document.getElementById('simName').textContent=curCase.name;
  document.getElementById('simSub').textContent=`케이스 ${krw(casePriceKrw)} · 열쇠 ${krw(keyPriceKrw)} · 오픈당 ${krw(casePriceKrw+keyPriceKrw)}`;
  buildProbRows();buildItemsList();setQty(1);updateStatsUI();
  document.getElementById('resultsList').innerHTML='<div class="empty-res">케이스를 열어보세요</div>';
  document.getElementById('resultHdrSub').textContent='';
}
function goBack(){
  stopAuto();
  document.getElementById('screenSelect').style.display='flex';
  document.getElementById('screenSim').style.display='none';
  document.getElementById('screenSim').classList.remove('active');
}

/* ── 확률/아이템 패널 ── */
function buildProbRows(){
  const max=79.92;
  document.getElementById('probRows').innerHTML=Object.entries(RC).map(([k,v])=>`
    <div class="prob-row">
      <span class="prob-name" style="color:${v.color}">${v.label}</span>
      <div class="prob-bar-wrap"><div class="prob-bar-fill" style="width:${((v.prob/max)*100).toFixed(2)}%;background:${v.color}"></div></div>
      <span class="prob-pct">${v.prob}%</span>
    </div>`).join('');
}
function buildItemsList(){
  const items=curCase.items;
  document.getElementById('itemsList').innerHTML=items.map(item=>{
    const rc=RC[item.r];
    const hasST=!item.noST;
    const pFN=Math.round(item.pFT/WEAR_MULT[0]);
    const pBS=Math.round(item.pFT*WEAR_MULT[4]/WEAR_MULT[2]);
    return `<div class="item-row">
      <div class="item-swatch" style="background:${rc.color}22;border:1px solid ${rc.color}44"></div>
      <div class="item-info">
        <div class="item-name" style="color:${rc.color}">${item.name}${hasST?'<span class="st-tag">ST</span>':''}</div>
        <div class="item-rarity">${rc.label}</div>
      </div>
      <div class="item-prices">
        <div class="item-range">${krw(pBS)} ~ ${krw(pFN)}</div>
        ${hasST?`<div class="item-st-range">ST: ${krw(Math.round(pBS*(item.stMul||1.15)))} ~ ${krw(Math.round(pFN*(item.stMul||1.15)))}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

/* ── 수량/릴 ── */
function setQty(q){
  if(spinning)return;
  qty=q;
  document.querySelectorAll('.qpill').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.q)===q));
  buildReels();
  document.getElementById('btnCost').textContent=qty>=100?'(빠른집계)':krw((casePriceKrw+keyPriceKrw)*qty);
}
function buildReels(){
  const c=document.getElementById('multiReels');
  c.innerHTML='';reelRefs=[];
  const show=Math.min(qty,10);
  for(let i=0;i<show;i++){
    const row=document.createElement('div');row.className='reel-row';
    const num=document.createElement('div');num.className='reel-num';num.textContent=i+1;
    const wrap=document.createElement('div');wrap.className='reel-wrap';
    const ptr=document.createElement('div');ptr.className='reel-ptr';
    const track=document.createElement('div');track.className='reel-track';track.id='rt_'+i;
    wrap.appendChild(track);wrap.appendChild(ptr);
    row.appendChild(num);row.appendChild(wrap);c.appendChild(row);
    reelRefs.push(track);fillReel(track,null);
  }
}
function fillReel(track,finalItem){
  const items=Array.from({length:55},()=>{const r=pickRarity();return pickItem(r);});
  if(finalItem)items[items.length-8]=finalItem;
  track.style.transition='none';track.style.transform='translateX(0)';
  track.innerHTML=items.map(item=>{
    const rc=RC[item.r];
    const short=(item.name.includes('|')?item.name.split('|')[1]:item.name).trim().slice(0,10);
    return `<div class="reel-item">
      <div class="ri-bar" style="background:${rc.color}20;border:1px solid ${rc.color}50;color:${rc.color}">${short}</div>
      <div class="ri-label">${item.name}</div>
      <div class="ri-bot" style="background:${rc.color}"></div>
    </div>`;
  }).join('');
}
function animateReel(track,delay){
  return new Promise(res=>{
    const W=84,vw=track.parentElement.offsetWidth;
    const cx=Math.floor(vw/2)-Math.floor(W/2);
    const ti=track.children.length-8;
    const fx=-(ti*W-cx)+(Math.random()*60-30);
    setTimeout(()=>{
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        track.style.transition='transform 3.5s cubic-bezier(0.08,1,0.18,1)';
        track.style.transform=`translateX(${fx}px)`;
        setTimeout(res,3600);
      }));
    },delay);
  });
}

/* ── 자동 열기 ── */
function toggleAuto(){
  if(autoRunning){stopAuto();}else{startAuto();}
}
function startAuto(){
  autoRunning=true;
  const btn=document.getElementById('autoBtn');
  btn.textContent='⏹ 정지';btn.classList.add('running');
  document.querySelectorAll('.qpill').forEach(b=>b.disabled=true);
  runAutoStep();
}
function stopAuto(){
  autoRunning=false;
  clearTimeout(autoTimer);
  const btn=document.getElementById('autoBtn');
  btn.textContent='⏵ 자동 열기';btn.classList.remove('running');
  document.querySelectorAll('.qpill').forEach(b=>b.disabled=false);
}
async function runAutoStep(){
  if(!autoRunning)return;
  await openCases(true);
  if(autoRunning)autoTimer=setTimeout(runAutoStep,200);
}

/* ── 케이스 오픈 ── */
async function openCases(fromAuto=false){
  if(spinning)return;
  spinning=true;
  document.getElementById('btnOpen').disabled=true;
  if(!fromAuto)AC.resume();

  const totalCost=casePriceKrw+keyPriceKrw;
  const drops=[];
  for(let i=0;i<qty;i++){
    const r=pickRarity(),item=pickItem(r),wIdx=pickWearIdx(),isST=pickST(item);
    openCount++;
    drops.push({item,wIdx,isST,price:getPriceWithST(item,wIdx,isST),seq:openCount});
  }

  if(qty>=100){
    drops.forEach(d=>{stats.total++;stats.cost+=totalCost;stats.value+=d.price;});
    sessionResults=[...drops,...sessionResults].slice(0,300);
    updateStatsUI();renderResults(drops,qty);
    spinning=false;document.getElementById('btnOpen').disabled=false;
    return;
  }

  reelRefs.forEach((t,i)=>fillReel(t,i<drops.length?drops[i].item:drops[0].item));
  /* 소리 */
  reelRefs.forEach((_,i)=>setTimeout(()=>playReel(),i*100));
  await Promise.all(reelRefs.map((t,i)=>animateReel(t,i*100)));
  drops.forEach(d=>{stats.total++;stats.cost+=totalCost;stats.value+=d.price;});
  sessionResults=[...drops,...sessionResults].slice(0,300);
  /* 등장음 */
  const best=drops.reduce((a,b)=>['mil','res','cl','sv','sp'].indexOf(b.item.r)>['mil','res','cl','sv','sp'].indexOf(a.item.r)?b:a,drops[0]);
  playReveal(best.item.r);
  updateStatsUI();renderResults(drops,qty);
  spinning=false;document.getElementById('btnOpen').disabled=false;
}

/* ── 결과 렌더 (가격순 + 순서 번호) ── */
function renderResults(drops,total){
  const list=document.getElementById('resultsList');
  const totalCost=casePriceKrw+keyPriceKrw;
  const rarOrd=['mil','res','cl','sv','sp'];
  const sorted=[...drops].sort((a,b)=>{
    const ri=rarOrd.indexOf(b.item.r)-rarOrd.indexOf(a.item.r);
    return ri!==0?ri:b.price-a.price;
  });
  const show=sorted.slice(0,total>=100?40:total);
  const hdr=document.getElementById('resultHdrSub');
  hdr.textContent=total>=100?`(${total}개 중 상위 40개)`:total>1?`(${total}개, 희귀도순)`:'';

  list.innerHTML=show.map(d=>{
    const rc=RC[d.item.r];
    const profit=d.price-totalCost;
    return `<div class="res-item">
      <div class="res-seq">#${d.seq}</div>
      <div class="res-bar" style="background:${rc.color}22;border:1px solid ${rc.color}44"></div>
      <div class="res-info">
        <div class="res-name" style="color:${rc.color}">${d.item.name}${d.isST?'<span class="res-st">ST™</span>':''}</div>
        <div class="res-wear">${WEARS[d.wIdx]}</div>
      </div>
      <div class="res-right">
        <div class="res-price" style="color:${rc.color}">${krw(d.price)}</div>
        <div class="res-profit ${profit>=0?'profit-pos':'profit-neg'}">${profitStr(profit)}</div>
      </div>
    </div>`;
  }).join('');
}

function updateStatsUI(){
  const profit=stats.value-stats.cost;
  document.getElementById('stTotal').textContent=stats.total.toLocaleString();
  document.getElementById('stCost').textContent=krw(stats.cost);
  document.getElementById('stValue').textContent=krw(stats.value);
  const el=document.getElementById('stProfit');
  el.className='stat-value '+(profit>=0?'pos':'neg');
  el.textContent=profitStr(profit);
}
function resetAll(){
  stopAuto();
  stats={total:0,cost:0,value:0};sessionResults=[];openCount=0;
  updateStatsUI();
  document.getElementById('resultsList').innerHTML='<div class="empty-res">케이스를 열어보세요</div>';
  document.getElementById('resultHdrSub').textContent='';
  buildReels();
}

buildCaseGrid();
</script>
